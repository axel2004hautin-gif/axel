<title>Rayon Homme Blue Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : un site de catalogue. Bandeau, en-tête collant (menu à gauche, nom au centre, icônes à droite),
   pages pleine largeur sur une grille de 1440 px ; photos au format 4:5, comme les fiches des marques. */
:root {
  --fond: #ffffff;
  --fond-2: #f2f3f5;
  --fond-3: #e7e9ed;
  --encre: #121417;
  --doux: #5b616d;
  --pale: #8a909b;
  --trait: #e1e3e8;
  --bandeau: #142a63;
  --sur-bandeau: #ffffff;
  --accent: #142a63;
  --sur-accent: #ffffff;
  --promo: #c3112d;
  --promo-doux: #fbe8eb;
  --bon: #19774a;
  --moyen: #a5650a;
  --etoile: #d69a00;
  --voile: rgba(10, 12, 16, .46);
  --ombre: 0 18px 44px rgba(18, 20, 23, .16);
  --police-marque: "Jost", "Futura", "Century Gothic", "Avenir Next", sans-serif;
  --police: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gouttiere-g: max(16px, env(safe-area-inset-left, 0px));
  --gouttiere-d: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0f1115; --fond-2: #181b21; --fond-3: #22262e; --encre: #eef0f3; --doux: #a7aeba; --pale: #7f8694;
    --trait: #2a2f38; --bandeau: #1c3984; --sur-bandeau: #ffffff; --accent: #93b2ff; --sur-accent: #0f1115;
    --promo: #ff6f82; --promo-doux: #3b1820; --bon: #52c98d; --moyen: #e5ad55; --etoile: #f2bd3a;
    --voile: rgba(0, 0, 0, .62); --ombre: 0 18px 44px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #0f1115; --fond-2: #181b21; --fond-3: #22262e; --encre: #eef0f3; --doux: #a7aeba; --pale: #7f8694;
  --trait: #2a2f38; --bandeau: #1c3984; --sur-bandeau: #ffffff; --accent: #93b2ff; --sur-accent: #0f1115;
  --promo: #ff6f82; --promo-doux: #3b1820; --bon: #52c98d; --moyen: #e5ad55; --etoile: #f2bd3a;
  --voile: rgba(0, 0, 0, .62); --ombre: 0 18px 44px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--fond); color: var(--encre); font-family: var(--police); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--fond); }
body.bloque { overflow: hidden; }
h1, h2, h3 { margin: 0; font-weight: 500; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }
.conteneur { max-width: 1440px; margin: 0 auto; padding-left: var(--gouttiere-g); padding-right: var(--gouttiere-d); }
.titre-marque { font-family: var(--police-marque); text-transform: uppercase; letter-spacing: .12em; font-weight: 500; }
.surtitre { font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--doux); }
.discret { color: var(--doux); }
.petit { font-size: .86rem; }
.chiffres { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Boutons et champs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px; border: 1px solid var(--encre); border-radius: 0; font-weight: 600; font-size: .9rem; letter-spacing: .02em; transition: background .15s, color .15s; }
.btn.plein { background: var(--encre); color: var(--fond); }
.btn.plein:hover { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); }
.btn.contour:hover { background: var(--encre); color: var(--fond); }
.btn.leger { border-color: var(--trait); }
.btn.leger:hover { border-color: var(--encre); }
.btn.danger { color: var(--promo); border-color: var(--promo); }
.btn.danger.arme { background: var(--promo); color: var(--fond); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lien { text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.lien:hover { color: var(--accent); }
.icone { width: 42px; height: 42px; display: inline-grid; place-items: center; position: relative; border-radius: 50%; }
.icone:hover { background: var(--fond-2); }
.icone svg, .picto { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.compteur { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--encre); color: var(--fond); font-size: .68rem; font-weight: 700; display: grid; place-items: center; }
label, .etiquette { font-size: .8rem; font-weight: 600; letter-spacing: .02em; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--trait); background: var(--fond); border-radius: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--encre); outline: none; }
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.champ { display: grid; gap: 6px; min-width: 0; }
.champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { border: 1px solid var(--trait); padding: 7px 12px; font-size: .86rem; font-weight: 500; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
.puce:hover { border-color: var(--encre); }
.puce[aria-pressed="true"] { background: var(--encre); color: var(--fond); border-color: var(--encre); }

/* Bandeau et en-tête */
.bandeau { background: var(--bandeau); color: var(--sur-bandeau); }
.bandeau .conteneur { min-height: 38px; display: grid; place-items: center; text-align: center; padding-block: 8px; }
.bandeau button { font-size: .84rem; font-weight: 600; letter-spacing: .01em; }
.bandeau button:hover { text-decoration: underline; text-underline-offset: 3px; }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fond); border-bottom: 1px solid var(--trait); }
.entete-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 66px; gap: 12px; }
.entete-gauche { display: flex; align-items: center; gap: 4px; min-width: 0; }
.entete-droite { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
.logo { font-family: var(--police-marque); font-weight: 500; font-size: 1.32rem; letter-spacing: .34em; text-transform: uppercase; white-space: nowrap; padding-left: .34em; }
.nav { display: none; }
.nav ul { display: flex; gap: 2px; flex-wrap: nowrap; }
.nav-item { padding: 10px 9px; font-size: .9rem; font-weight: 500; color: var(--doux); border-bottom: 2px solid transparent; white-space: nowrap; }
.nav-item:hover, .nav-item[aria-expanded="true"], .nav-item.actif { color: var(--encre); }
.nav-item.actif { border-bottom-color: var(--encre); }
.nav-item.promo { color: var(--promo); }
.seul-mobile { display: inline-grid; }
@media (min-width: 1360px) { .nav { display: block; } .seul-mobile { display: none; } }
@media (max-width: 520px) { .logo { font-size: 1rem; letter-spacing: .26em; padding-left: .26em; } .entete-in { min-height: 58px; gap: 4px; } .icone { width: 38px; height: 38px; } }

/* Méga-menu */
.mega { position: absolute; left: 0; right: 0; top: 100%; background: var(--fond); border-bottom: 1px solid var(--trait); box-shadow: var(--ombre); max-height: calc(100vh - 140px); overflow-y: auto; }
.mega-in { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, .9fr) minmax(0, 1.6fr); gap: 40px; padding-block: 36px 40px; }
.mega-liste { display: grid; gap: 2px; align-content: start; border-right: 1px solid var(--trait); padding-right: 24px; }
.mega-liste.colonnes { display: block; columns: 2; column-gap: 28px; }
.mega-liste.colonnes li { break-inside: avoid; }
.mega-lien { display: flex; justify-content: space-between; gap: 10px; width: 100%; padding: 9px 0; font-size: 1rem; }
.mega-lien:hover { color: var(--accent); }
.mega-lien span { color: var(--pale); font-size: .85rem; font-variant-numeric: tabular-nums; }
.mega-lien.tout { font-weight: 600; }
.mega-lien.vide { color: var(--pale); }
.mega-visuels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; grid-column: 3; }
.mega-note { color: var(--doux); font-size: .9rem; align-self: start; }

/* Tiroirs (menu mobile, filtres) */
.tiroir { position: fixed; top: 0; bottom: 0; z-index: 50; width: min(420px, 100%); background: var(--fond); display: flex; flex-direction: column; box-shadow: var(--ombre); }
.tiroir.gauche { left: 0; padding-left: env(safe-area-inset-left, 0px); }
.tiroir.droite { right: 0; padding-right: env(safe-area-inset-right, 0px); }
.tiroir-tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; border-bottom: 1px solid var(--trait); }
.tiroir-tete h2 { font-size: 1.05rem; font-weight: 600; }
.tiroir-corps { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 16px 20px; }
.tiroir-lien .picto { width: 18px; height: 18px; flex: none; }
.tiroir-pied { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--trait); display: flex; gap: 10px; }
.tiroir-pied .btn { flex: 1; }
.voile { position: fixed; inset: 0; z-index: 45; background: var(--voile); }
.tiroir-lien { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 15px 2px; border-bottom: 1px solid var(--trait); font-size: 1.02rem; font-weight: 500; }
.tiroir-lien span { color: var(--pale); font-size: .86rem; font-weight: 400; }
.tiroir-lien.promo { color: var(--promo); }
.tiroir-retour { display: flex; align-items: center; gap: 6px; padding: 12px 0; font-weight: 600; }

/* Recherche */
.recherche { position: fixed; inset: 0 0 auto; z-index: 50; background: var(--fond); box-shadow: var(--ombre); max-height: 100%; overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); }
.recherche-barre { display: flex; align-items: center; gap: 10px; padding-block: 14px; border-bottom: 1px solid var(--trait); }
.recherche-barre input { border: 0; font-size: 1.15rem; padding-inline: 4px; min-height: 48px; background: transparent; }
.recherche-resultats { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 32px; padding-block: 22px 28px; }
@media (max-width: 760px) { .recherche-resultats { grid-template-columns: 1fr; gap: 18px; } }
.suggestions { display: grid; gap: 4px; align-content: start; }
.suggestions .surtitre { margin: 6px 0 4px; }
.suggestion { padding: 6px 0; text-align: left; }
.suggestion:hover { color: var(--accent); }
.suggestion mark { background: none; color: inherit; font-weight: 700; }
.mini-articles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.mini { display: grid; gap: 6px; text-align: left; }
.mini img, .mini .sans-photo { aspect-ratio: 4 / 5; width: 100%; object-fit: cover; background: var(--fond-2); }
.mini span { font-size: .84rem; }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; align-items: center; padding-block: 44px 28px; }
.hero h1 { font-family: var(--police-marque); font-size: clamp(2.2rem, 5vw, 4rem); text-transform: uppercase; letter-spacing: .04em; font-weight: 500; line-height: 1.02; }
.hero-texte { display: grid; gap: 18px; align-content: center; }
.hero-texte p.discret { max-width: 44ch; font-size: 1.02rem; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-photos { display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; aspect-ratio: 6 / 5; max-width: 100%; }
.hero-photos > * { min-height: 0; background: var(--fond-2); overflow: hidden; }
.hero-photos > *:first-child { grid-row: 1 / 3; }
.hero-photos img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.hero-photos button:hover img { transform: scale(1.03); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-block: 24px 8px; gap: 22px; } .hero-photos { order: -1; } }
.section-accueil { padding-block: 34px 8px; display: grid; gap: 18px; }
.section-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-tete h2 { font-family: var(--police-marque); font-size: 1.5rem; text-transform: uppercase; letter-spacing: .08em; }
.tuiles { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 14px; max-width: calc(var(--n, 4) * 340px + (var(--n, 4) - 1) * 14px); }
@media (max-width: 900px) { .tuiles { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: none; } }
.tuile { display: grid; gap: 10px; text-align: left; }
.tuile-visuel { display: block; aspect-ratio: 4 / 5; background: var(--fond-2); overflow: hidden; position: relative; }
.tuile-visuel img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.tuile:hover img { transform: scale(1.03); }
.tuile-nom { font-size: 1.05rem; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.tuile-nom span { color: var(--pale); font-size: .86rem; font-weight: 400; }
.monogramme { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--police-marque); font-size: clamp(1.4rem, 3vw, 2.2rem); text-transform: uppercase; letter-spacing: .14em; color: var(--pale); text-align: center; padding: 12px; }
.marques { display: flex; flex-wrap: wrap; gap: 10px; }
.marque-tuile { border: 1px solid var(--trait); padding: 16px 22px; font-family: var(--police-marque); text-transform: uppercase; letter-spacing: .12em; font-size: 1rem; display: inline-flex; gap: 10px; align-items: baseline; }
.marque-tuile span { font-family: var(--police); letter-spacing: 0; font-size: .82rem; color: var(--pale); text-transform: none; }
.marque-tuile:hover { border-color: var(--encre); }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 23%); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
.rail > * { scroll-snap-align: start; }
@media (max-width: 760px) { .rail { grid-auto-columns: 46%; } }
.a-completer { border: 1px solid var(--trait); padding: 18px 20px; display: flex; gap: 14px 24px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.a-completer ul { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--doux); }

/* Liste d'articles */
.fil { display: flex; flex-wrap: wrap; gap: 6px; font-size: .84rem; color: var(--doux); padding-top: 20px; }
.fil button:hover { color: var(--encre); text-decoration: underline; }
.fil li + li::before { content: "/"; margin-right: 6px; color: var(--pale); }
.liste-tete { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-block: 10px 16px; }
.liste-tete h1 { font-family: var(--police-marque); font-size: clamp(1.8rem, 4vw, 2.6rem); text-transform: uppercase; letter-spacing: .06em; }
.sous-categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; }
.sous-categories .puce { white-space: nowrap; }
.liste-corps { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 36px; align-items: start; padding-bottom: 50px; }
.cote { position: sticky; top: 86px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 6px; }
.barre-outils { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.barre-outils select { width: auto; min-width: 190px; }
.btn-filtres { display: none; }
@media (max-width: 1099px) { .liste-corps { grid-template-columns: minmax(0, 1fr); } .cote { display: none; } .btn-filtres { display: inline-flex; } }
.actifs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.actif { display: inline-flex; align-items: center; gap: 6px; background: var(--fond-2); padding: 6px 10px; font-size: .84rem; }
.actif:hover { background: var(--fond-3); }
.grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 14px; }
@media (min-width: 760px) { .grille { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 18px; } }
@media (min-width: 1400px) { .grille { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.grille.large { }
@media (min-width: 1100px) { .grille.large { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.plus { display: grid; justify-items: center; gap: 10px; margin-top: 36px; }
.vide-liste { border: 1px dashed var(--trait); padding: 36px 20px; text-align: center; display: grid; gap: 14px; justify-items: center; grid-column: 1 / -1; }

/* Facettes */
.facette { border-bottom: 1px solid var(--trait); }
.facette summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 15px 0; font-weight: 600; font-size: .94rem; }
.facette summary::-webkit-details-marker { display: none; }
.facette summary::after { content: "+"; font-weight: 400; font-size: 1.2rem; line-height: 1; }
.facette[open] summary::after { content: "−"; }
.facette .nb { margin-left: auto; background: var(--encre); color: var(--fond); border-radius: 9px; min-width: 18px; height: 18px; font-size: .7rem; display: grid; place-items: center; padding: 0 5px; }
.options { display: grid; gap: 2px; padding-bottom: 14px; }
.option { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 0; font-size: .9rem; text-align: left; }
.option .case { width: 18px; height: 18px; border: 1px solid var(--pale); flex: none; display: grid; place-items: center; }
.option[aria-pressed="true"] .case { background: var(--encre); border-color: var(--encre); }
.option[aria-pressed="true"] .case::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--fond); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.option .compte { margin-left: auto; color: var(--pale); font-size: .8rem; font-variant-numeric: tabular-nums; }
.option:hover { color: var(--accent); }
.couleurs-facette { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px 6px; padding-bottom: 16px; }
.pastille-filtre { display: grid; justify-items: center; gap: 4px; font-size: .74rem; text-align: center; color: var(--doux); }
.pastille-filtre .rond { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--trait); box-shadow: inset 0 0 0 2px var(--fond); }
.pastille-filtre[aria-pressed="true"] .rond { outline: 2px solid var(--encre); outline-offset: 2px; }
.pastille-filtre[aria-pressed="true"] { color: var(--encre); font-weight: 600; }
.tailles-facette { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; padding-bottom: 16px; }
.taille-filtre { border: 1px solid var(--trait); min-height: 40px; font-size: .84rem; text-align: center; font-variant-numeric: tabular-nums; }
.taille-filtre:hover { border-color: var(--encre); }
.taille-filtre[aria-pressed="true"] { background: var(--encre); color: var(--fond); border-color: var(--encre); }
.tri-mobile { display: grid; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--trait); }

/* Carte article */
.carte { display: grid; gap: 10px; align-content: start; min-width: 0; }
.carte-visuel { position: relative; aspect-ratio: 4 / 5; background: var(--fond-2); overflow: hidden; }
.carte-visuel > .carte-lien { position: absolute; inset: 0; width: 100%; height: 100%; }
.carte-visuel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .3s ease, transform .5s ease; }
.carte-visuel img.seconde { opacity: 0; }
@media (hover: hover) { .carte:hover .carte-visuel img.seconde { opacity: 1; } .carte:hover .carte-visuel img:only-of-type { transform: scale(1.03); } }
.sans-photo { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 14px; color: var(--pale); font-family: var(--police-marque); text-transform: uppercase; letter-spacing: .12em; font-size: .9rem; }
.badges { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; pointer-events: none; }
